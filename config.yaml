# py-MUSHRA configuration

# Folder of "<prefix>_<suffix>.wav" stimuli. Files sharing a prefix form one
# MUSHRA page/item. The suffix "target" marks the true reference for that item.
stimuli_dir: stimuli

# Folder of stimuli played on the familiarisation page (any .wav files --
# they do not need to follow the "<prefix>_<suffix>.wav" convention above).
# Using the demo stimuli for now until real familiarisation stimuli are added.
familiarisation_dir: familiarisation

# Where timestamped result CSVs are written.
results_dir: results

# Decoding happens outside this app (e.g. a Max patcher hosting SceneRotator +
# AllRADecoder): the stimuli are played out undecoded, as raw Ambisonics, to the
# selected output device -- typically a loopback device such as Pro Tools Audio Bridge 64
# that the decoder reads from. This is the number of Ambisonic channels sent
# (25 for 4th order). Leave null to use the channel count of the stimuli.
num_channels: 25

sample_rate: 48000
block_size: 512
